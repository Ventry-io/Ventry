# One isolated stack per PR preview (Compose project ventry-pr-<n>).
# Managed by preview.sh, which writes the interpolation values into the instance's .env. See docs/pr-previews.md.
name: ${PREVIEW_PROJECT:?}

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  app:
    <<: *common
    image: ${APP_IMAGE:?}
    container_name: ${PREVIEW_PROJECT}-app
    cap_drop: [ALL]
    # Shared preview settings (OAuth proxy, client IDs, optional test-mode keys).
    env_file:
      - ${PREVIEW_ROOT:?}/app.env
    # `environment` wins over env_file, so app.env can never point a preview at another database, Redis or mail server.
    environment:
      NODE_ENV: production
      BETTER_AUTH_URL: ${PREVIEW_URL:?}
      BETTER_AUTH_TRUSTED_ORIGINS: ${PREVIEW_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      JWT_ISSUER: ${PREVIEW_URL}
      JWT_AUDIENCE: ${PREVIEW_URL}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD:?}@postgres:5432/ventry
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: preview
      SMTP_PASS: preview
      SMTP_FROM: Ventry Preview <no-reply@preview.invalid>
      # The preview image is built without a Turnstile site key.
      TURNSTILE_SECRET_KEY: ""
    healthcheck:
      interval: 15s
      start_period: 90s
      start_interval: 3s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mail: { condition: service_started }
    networks: [internal, previews]
    deploy:
      resources:
        limits: { cpus: "${PREVIEW_APP_CPUS:-1.0}", memory: "${PREVIEW_APP_MEMORY:-768m}", pids: 512 }

  # One-off: `docker compose run --rm migrate` (prisma migrate deploy against this preview's database only).
  migrate:
    image: ${MIGRATE_IMAGE:?}
    profiles: [tools]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD}@postgres:5432/ventry
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  postgres:
    <<: *common
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/10-app-role.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ventry"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "${PREVIEW_POSTGRES_MEMORY:-256m}" }

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis-data:/data
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }

  # Captures every preview email; the UI is served at <preview-url>/_mail/ behind basic auth.
  mail:
    <<: *common
    image: axllent/mailpit:v1.29
    container_name: ${PREVIEW_PROJECT}-mail
    environment:
      MP_WEBROOT: /_mail/
      MP_UI_AUTH_FILE: /run/mailpit-ui.htpasswd
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    volumes:
      - ${PREVIEW_ROOT}/mailpit-ui.htpasswd:/run/mailpit-ui.htpasswd:ro
    networks: [internal, previews]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64m }

configs:
  postgres-init:
    # Runs once on an empty volume. The app gets a non-superuser role that owns only its own database.
    content: |
      CREATE ROLE app LOGIN PASSWORD '${APP_DB_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE;
      CREATE DATABASE ventry OWNER app;
      REVOKE ALL ON DATABASE ventry FROM PUBLIC;

volumes:
  postgres-data:
  redis-data:

networks:
  # No route to the internet or to other stacks; only this preview's services.
  internal:
    internal: true
  # Shared with Caddy (and other previews) for routing and outbound traffic. Never the production caddy-public network.
  previews:
    external: true
    name: ${PREVIEW_NETWORK:-ventry-previews}
