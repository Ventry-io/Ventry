name: PR Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build prisma
        run: npx prisma generate
        env:
          DATABASE_URL: "prisma+postgres://dummy:dummy@dummy/dummy?api_key=dummy"

      - name: Run tests
        run: npm test

      - name: Check Renovate issue workflow exemptions
        run: node --test .github/scripts/renovate.node-test.mjs
