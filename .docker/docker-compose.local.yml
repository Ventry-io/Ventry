services:
  postgres:
    image: postgres:17
    container_name: myapp-postgres-local
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: ventry
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d ventry"]
      interval: 2s
      timeout: 5s
      retries: 15
  redis:
    image: redis:8.8
    container_name: myapp-redis-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres_local_data:
